    <ellipse cx="960" cy="706" rx="330" ry="66" stroke="#00bfff" stroke-width="3" opacity=".80"/>
    <ellipse cx="960" cy="706" rx="246" ry="48" stroke="#1677ff" stroke-width="3" opacity=".72"/>
    <ellipse cx="960" cy="706" rx="152" ry="29" stroke="#39d9ff" stroke-width="3" opacity=".86"/>
    <ellipse cx="960" cy="706" rx="70" ry="14" stroke="#b7f5ff" stroke-width="2.5" opacity=".94"/>
  </g>
  <ellipse cx="960" cy="706" rx="54" ry="11" fill="#b7f5ff" opacity=".68" filter="url(#glowMedium)"/>
  <path d="M920 710L1000 710L1110 1050H810Z" fill="#008cff" opacity=".055" filter="url(#blurLarge)"/>
  <ellipse cx="960" cy="916" rx="430" ry="80" fill="#0077ff" opacity=".065" filter="url(#blurLarge)"/>

  <!-- Foreground light streaks -->
