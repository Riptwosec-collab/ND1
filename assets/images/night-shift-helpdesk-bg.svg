    <circle cx="1544" cy="109" r="1"/><circle cx="1648" cy="48" r="1.3"/><circle cx="1760" cy="98" r="1"/>
    <circle cx="1872" cy="58" r="1.2"/><circle cx="97" cy="214" r="1"/><circle cx="274" cy="185" r="1.2"/>
    <circle cx="455" cy="222" r="1"/><circle cx="670" cy="177" r="1.2"/><circle cx="890" cy="205" r="1"/>
    <circle cx="1115" cy="170" r="1.1"/><circle cx="1332" cy="218" r="1"/><circle cx="1518" cy="178" r="1.2"/>
    <circle cx="1792" cy="207" r="1"/>
  </g>

