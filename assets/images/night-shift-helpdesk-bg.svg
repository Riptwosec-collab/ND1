    <path d="M1478 522L1383 505L1348 644L1442 666Z"/>
  </g>
  <g fill="url(#screen)" stroke="#1aa7ff" stroke-width="1.4">
    <path d="M39 624L187 592L202 716L54 748Z"/>
    <path d="M241 579L405 546L438 684L274 717Z"/>
    <path d="M457 535L525 523L551 632L484 647Z"/>
    <path d="M1881 624L1733 592L1718 716L1866 748Z"/>
    <path d="M1679 579L1515 546L1482 684L1646 717Z"/>
    <path d="M1463 535L1395 523L1369 632L1436 647Z"/>
  </g>
  <g fill="none" stroke="#39d9ff" stroke-width="2" opacity=".78" filter="url(#glowSmall)">
    <path d="M56 707L80 672L104 684L128 637L153 656L179 620"/>
    <path d="M274 681V625M296 681V647M318 681V612M340 681V640M362 681V600M384 681V632M406 681V651"/>
    <ellipse cx="512" cy="580" rx="27" ry="22"/><path d="M485 580h54M512 558v44"/>
    <path d="M1864 707L1840 672L1816 684L1792 637L1767 656L1741 620"/>
    <path d="M1646 681V625M1624 681V647M1602 681V612M1580 681V640M1558 681V600M1536 681V632M1514 681V651"/>
    <ellipse cx="1408" cy="580" rx="27" ry="22"/><path d="M1381 580h54M1408 558v44"/>
  </g>
  <g fill="#057cff" opacity=".62">
    <circle cx="73" cy="627" r="3"/><circle cx="90" cy="624" r="3"/><circle cx="107" cy="620" r="3"/>
    <circle cx="1813" cy="627" r="3"/><circle cx="1830" cy="624" r="3"/><circle cx="1847" cy="620" r="3"/>
  </g>

  <!-- Reflective metallic floor and perspective grid -->
  <path d="M0 640Q960 540 1920 640V1080H0Z" fill="url(#floor)"/>
  <g clip-path="url(#floorClip)">
    <rect x="0" y="620" width="1920" height="460" fill="url(#fineGrid)" opacity=".56"/>
    <g stroke="#0b6ee1" stroke-width="1.2" opacity=".37">
      <path d="M960 600L42 1080"/><path d="M960 600L220 1080"/><path d="M960 600L410 1080"/>
      <path d="M960 600L602 1080"/><path d="M960 600L780 1080"/><path d="M960 600L960 1080"/>
      <path d="M960 600L1140 1080"/><path d="M960 600L1318 1080"/><path d="M960 600L1510 1080"/>
      <path d="M960 600L1700 1080"/><path d="M960 600L1878 1080"/>
