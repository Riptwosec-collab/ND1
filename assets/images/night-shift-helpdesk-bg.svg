<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Night Shift cinematic NOC command center</title>
  <desc id="desc">Clean deep navy command center background with a connected world map, moon, city skyline, side monitoring consoles and reflective perspective floor.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01040b"/>
      <stop offset=".42" stop-color="#02142f"/>
      <stop offset=".72" stop-color="#020b1c"/>
      <stop offset="1" stop-color="#01040b"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#087dff" stop-opacity=".34"/>
      <stop offset=".32" stop-color="#0060d8" stop-opacity=".16"/>
      <stop offset=".72" stop-color="#00142f" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".36" stop-color="#e8f3ff"/>
      <stop offset=".72" stop-color="#9fb9dc"/>
      <stop offset="1" stop-color="#6987ad"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#031a3b" stop-opacity=".56"/>
      <stop offset=".35" stop-color="#020d20" stop-opacity=".90"/>
      <stop offset="1" stop-color="#01040b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset=".45" stop-color="#010814"/>
      <stop offset="1" stop-color="#020f23"/>
    </linearGradient>
    <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="24" r="1" fill="#61ecff" opacity=".75"/>
      <circle cx="82" cy="16" r=".8" fill="#8ddfff" opacity=".55"/>
      <circle cx="128" cy="72" r="1.1" fill="#087dff" opacity=".75"/>
      <circle cx="42" cy="91" r=".7" fill="#b8edff" opacity=".48"/>
    </pattern>
    <pattern id="windows" width="18" height="20" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="3" height="6" rx="1" fill="#16cfff" opacity=".62"/>
      <rect x="11" y="5" width="3" height="6" rx="1" fill="#087dff" opacity=".48"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floorClip"><path d="M0 592H1920V1080H0Z"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="620" fill="url(#stars)" opacity=".72"/>
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>

  <!-- moon and light cloud -->
  <g opacity=".96">
    <circle cx="1650" cy="105" r="59" fill="url(#moon)" filter="url(#softGlow)"/>
    <circle cx="1632" cy="92" r="10" fill="#829bbd" opacity=".42"/>
    <circle cx="1668" cy="126" r="14" fill="#718aad" opacity=".35"/>
  </g>
  <path d="M1510 160c58-32 102-30 151 2 52-24 112-22 166 7" fill="none" stroke="#345378" stroke-width="18" opacity=".12" stroke-linecap="round"/>

  <!-- world network map -->
  <g fill="none" stroke="#087dff" stroke-width="1.6" opacity=".55" filter="url(#smallGlow)">
    <path d="M265 116l79-43 118 7 91 37 75-18 97 36 47 67-41 42-76-18-63 22-72-22-55 27-74-20-57 17-79-42-48-59z"/>
    <path d="M722 104l90-50 126 9 65 33 94-10 91 50 58 55-35 45-78-10-76 31-65-28-76 18-52-32-78 15-59-42z"/>
    <path d="M1165 114l85-36 99 19 64 43 80-11 77 48-20 50-73 8-52 34-75-23-65 26-52-40-75 10-47-52z"/>
    <path d="M404 139Q760 7 1087 171"/>
    <path d="M530 205Q910 26 1354 206"/>
    <path d="M698 111Q984 4 1434 190"/>
    <path d="M330 176Q785 322 1306 139"/>
  </g>
  <g fill="#61ecff" filter="url(#smallGlow)">
    <circle cx="343" cy="135" r="4"/><circle cx="461" cy="92" r="4"/><circle cx="596" cy="168" r="4"/>
    <circle cx="751" cy="116" r="4"/><circle cx="896" cy="89" r="4"/><circle cx="1004" cy="153" r="4"/>
    <circle cx="1168" cy="126" r="4"/><circle cx="1287" cy="177" r="4"/><circle cx="1432" cy="142" r="4"/>
  </g>

  <!-- city skyline, center intentionally open -->
  <g fill="#010711" stroke="#073a75" stroke-width="2">
    <path d="M0 500V282h58v-95h48v313h52V230h60v270h48V325h63v175h48V205h61v295h52V310h70v190h72V370h68v130H0Z"/>
    <path d="M1920 500V246h-62v254h-48V190h-62v310h-52V290h-58v210h-52V225h-64v275h-55V320h-66v180h-58V268h-64v232h-62V360h-67v140h718Z"/>
  </g>
  <g fill="url(#windows)" opacity=".82">
    <rect x="18" y="300" width="117" height="198"/><rect x="166" y="245" width="85" height="255"/>
    <rect x="278" y="342" width="92" height="158"/><rect x="391" y="222" width="102" height="278"/>
    <rect x="505" y="322" width="86" height="178"/>
    <rect x="1337" y="286" width="92" height="214"/><rect x="1449" y="235" width="100" height="265"/>
    <rect x="1578" y="326" width="92" height="174"/><rect x="1692" y="205" width="104" height="295"/>
    <rect x="1818" y="262" width="87" height="238"/>
  </g>
  <g stroke="#087dff" stroke-width="3" opacity=".55">
    <path d="M105 188V120M109 120h-8M433 207v-70M437 137h-8M1751 192v-72M1755 120h-8M1516 229v-66M1520 163h-8"/>
  </g>

  <!-- side command-center consoles without foreground shadow sheets -->
  <g stroke="#087dff" stroke-width="3" fill="url(#metal)" opacity=".92">
    <path d="M0 520L365 450l128 68-58 170L0 730Z"/>
    <path d="M1920 520l-365-70-128 68 58 170 435 42Z"/>
  </g>
  <g fill="#03132c" stroke="#00bfff" stroke-width="2" opacity=".95">
    <path d="M28 548l128-30 24 118-140 31z"/><path d="M177 512l135-30 25 121-139 30z"/><path d="M325 486l107-20 21 99-105 23z"/>
    <path d="M1892 548l-128-30-24 118 140 31z"/><path d="M1743 512l-135-30-25 121 139 30z"/><path d="M1595 486l-107-20-21 99 105 23z"/>
  </g>
  <g stroke="#39d9ff" stroke-width="2" fill="none" opacity=".72">
    <path d="M52 626l30-32 26 17 30-48 24 23"/><path d="M204 586h98M214 571h72M358 537l18-22 18 12 22-36"/>
    <path d="M1868 626l-30-32-26 17-30-48-24 23"/><path d="M1716 586h-98M1706 571h-72M1562 537l-18-22-18 12-22-36"/>
  </g>
  <g fill="#087dff" opacity=".8">
    <circle cx="65" cy="563" r="4"/><circle cx="84" cy="559" r="4"/><circle cx="104" cy="555" r="4"/>
    <circle cx="1855" cy="563" r="4"/><circle cx="1836" cy="559" r="4"/><circle cx="1816" cy="555" r="4"/>
  </g>

  <!-- metallic reflective floor and perspective grid -->
  <path d="M0 592H1920V1080H0Z" fill="url(#floor)"/>
  <g clip-path="url(#floorClip)" fill="none">
    <g stroke="#087dff" stroke-width="1.3" opacity=".48">
      <path d="M960 592L70 1080M960 592L250 1080M960 592L430 1080M960 592L610 1080M960 592L790 1080M960 592L1130 1080M960 592L1310 1080M960 592L1490 1080M960 592L1670 1080M960 592L1850 1080"/>
      <path d="M0 650H1920M0 720H1920M0 800H1920M0 895H1920M0 1005H1920"/>
    </g>
    <g stroke="#00bfff" opacity=".48">
      <ellipse cx="960" cy="675" rx="355" ry="78" stroke-width="3"/>
      <ellipse cx="960" cy="675" rx="480" ry="116" stroke-width="2"/>
      <ellipse cx="960" cy="675" rx="650" ry="170" stroke-width="1.5"/>
      <ellipse cx="960" cy="675" rx="820" ry="235" stroke-width="1"/>
    </g>
    <ellipse cx="960" cy="675" rx="260" ry="52" fill="#087dff" opacity=".07"/>
    <ellipse cx="960" cy="686" rx="205" ry="34" fill="#39d9ff" opacity=".06" filter="url(#softGlow)"/>
  </g>

  <!-- subtle foreground light only, no dark overlay panels -->
  <path d="M480 1000Q960 895 1440 1000" fill="none" stroke="#087dff" stroke-width="2" opacity=".34"/>
  <path d="M610 1030Q960 958 1310 1030" fill="none" stroke="#39d9ff" stroke-width="1.5" opacity=".28"/>
</svg>
