    <path d="M277 71L228 216M319 49L184 181M505 64L635 184M613 62L681 180M772 105L635 184M872 153L827 226M958 165L905 225"/>
  </g>
  <g fill="#7bf0ff" filter="url(#glowMedium)">
    <circle cx="330" cy="202" r="3.8"/><circle cx="451" cy="151" r="3.2"/><circle cx="539" cy="281" r="3.7"/>
    <circle cx="647" cy="139" r="3.3"/><circle cx="771" cy="271" r="3.8"/><circle cx="896" cy="186" r="3.2"/>
    <circle cx="1025" cy="302" r="3.8"/><circle cx="1152" cy="206" r="3.2"/><circle cx="1276" cy="300" r="3.8"/>
    <circle cx="1396" cy="220" r="3.2"/><circle cx="1477" cy="319" r="3.8"/>
  </g>
  <g fill="none" stroke="#1789ff" stroke-width="1.4" opacity=".45">
    <path d="M336 201Q612 16 896 186T1477 319"/>
    <path d="M451 151Q758 332 1025 302T1396 220"/>
    <path d="M539 281Q814 85 1152 206T1477 319"/>
  </g>

  <!-- City skyline: left and right, central gap preserved -->
  <g opacity=".98">
    <path d="M0 654V352H48V301H91V423H126V272H175V211H219V437H254V341H298V654Z" fill="url(#windows)"/>
    <path d="M272 654V446H329V372H375V654ZM397 654V404H444V320H483V654Z" fill="url(#windows)" opacity=".88"/>
    <path d="M1480 654V412H1528V325H1568V654ZM1594 654V348H1638V294H1678V413H1715V254H1764V198H1808V429H1844V331H1920V654Z" fill="url(#windows)"/>
    <path d="M132 654V431H169V359H201V654ZM1426 654V428H1465V350H1497V654Z" fill="url(#metal)"/>
  </g>
  <g stroke="#1abfff" stroke-width="2" opacity=".60" filter="url(#glowSmall)">
    <path d="M48 383H91M126 316H175M1638 338H1678M1715 299H1764"/>
    <path d="M151 272V225M1740 254V205M217 211V168M1786 198V157"/>
  </g>
  <g fill="#ff6a42" opacity=".42">
