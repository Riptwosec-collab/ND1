<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Night Shift Helpdesk cinematic NOC command center</title>
  <desc id="desc">Deep navy futuristic operations room with a connected world map, night skyline, moon, curved monitoring consoles, reflective metallic floor and holographic platform.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01040b"/>
      <stop offset=".34" stop-color="#03132c"/>
      <stop offset=".68" stop-color="#020b1c"/>
      <stop offset="1" stop-color="#01040b"/>
    </linearGradient>
    <radialGradient id="atmosphere" cx="50%" cy="47%" r="60%">
      <stop offset="0" stop-color="#0876ff" stop-opacity=".30"/>
      <stop offset=".32" stop-color="#0048b7" stop-opacity=".18"/>
      <stop offset=".72" stop-color="#00132c" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071e43" stop-opacity=".90"/>
      <stop offset=".34" stop-color="#03132d" stop-opacity=".96"/>
      <stop offset="1" stop-color="#01040b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2751"/>
      <stop offset=".24" stop-color="#061b3b"/>
      <stop offset=".7" stop-color="#020a19"/>
      <stop offset="1" stop-color="#01050d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051a39"/>
      <stop offset=".55" stop-color="#031127"/>
      <stop offset="1" stop-color="#010712"/>
    </linearGradient>
    <radialGradient id="moon" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".32" stop-color="#ecf5ff"/>
      <stop offset=".72" stop-color="#9fb9da"/>
      <stop offset="1" stop-color="#637e9f"/>
    </radialGradient>
    <pattern id="windows" width="18" height="24" patternUnits="userSpaceOnUse">
      <rect width="18" height="24" fill="#020918"/>
      <rect x="3" y="4" width="3" height="5" rx="1" fill="#087cff" opacity=".88"/>
      <rect x="11" y="4" width="3" height="5" rx="1" fill="#35d9ff" opacity=".62"/>
      <rect x="3" y="14" width="3" height="5" rx="1" fill="#0a58ba" opacity=".60"/>
      <rect x="11" y="14" width="3" height="5" rx="1" fill="#0b9eea" opacity=".46"/>
    </pattern>
    <pattern id="fineGrid" width="64" height="42" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V42" fill="none" stroke="#0b72df" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <filter id="glowSmall" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMedium" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurLarge" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="floorClip"><path d="M0 640Q960 540 1920 640V1080H0Z"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#atmosphere)"/>
  <ellipse cx="960" cy="520" rx="690" ry="360" fill="#0877ff" opacity=".055" filter="url(#blurLarge)"/>

  <!-- Star particles -->
  <g fill="#71e8ff" opacity=".82">
    <circle cx="56" cy="64" r="1.2"/><circle cx="124" cy="118" r="1"/><circle cx="208" cy="46" r="1.3"/>
    <circle cx="292" cy="101" r="1"/><circle cx="387" cy="55" r="1.4"/><circle cx="476" cy="132" r="1"/>
    <circle cx="585" cy="61" r="1.2"/><circle cx="683" cy="116" r="1"/><circle cx="781" cy="48" r="1.3"/>
    <circle cx="884" cy="97" r="1"/><circle cx="995" cy="54" r="1.4"/><circle cx="1102" cy="116" r="1"/>
