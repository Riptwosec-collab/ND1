  <g transform="translate(182 42) scale(1.18)" fill="none" stroke="#39d9ff" stroke-width="1.05" opacity=".61">
    <path d="M102 137L204 80L307 127L469 104L596 120L739 118L867 175L1009 279"/>
    <path d="M126 166L241 179L359 246L558 148L664 214L843 205L974 187"/>
