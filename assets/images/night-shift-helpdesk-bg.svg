      <ellipse cx="960" cy="790" rx="640" ry="112"/><ellipse cx="960" cy="930" rx="870" ry="190"/>
    </g>
    <ellipse cx="960" cy="740" rx="620" ry="125" fill="#087cff" opacity=".07" filter="url(#blurLarge)"/>
