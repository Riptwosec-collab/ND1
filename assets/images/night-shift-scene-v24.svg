 <ellipse cx="960" cy="708" rx="370" ry="70" stroke="#00bfff" stroke-width="2.2" opacity=".72"/>
 <ellipse cx="960" cy="708" rx="278" ry="52" stroke="#118dff" stroke-width="2.2" opacity=".72"/>
 <ellipse cx="960" cy="708" rx="176" ry="34" stroke="#63efff" stroke-width="2.5" opacity=".90"/>
 <ellipse cx="960" cy="708" rx="68" ry="14" stroke="#e6fdff" stroke-width="2" opacity=".95"/>
