<g stroke="#096eff" stroke-width="1" opacity=".32"><path d="M960 610 70 1080M960 610 260 1080M960 610 450 1080M960 610 640 1080M960 610 810 1080M960 610 1110 1080M960 610 1280 1080M960 610 1470 1080M960 610 1660 1080M960 610 1850 1080"/><path d="M0 674h1920M0 736h1920M0 810h1920M0 897h1920M0 998h1920"/></g>
