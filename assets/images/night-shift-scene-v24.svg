<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">Night Shift Global Network Command Center</title>
<desc id="d">Cinematic midnight blue NOC command center with global network map, futuristic city, monitoring consoles, moon, reflective floor and holographic platform.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#01040c"/><stop offset=".48" stop-color="#03132b"/><stop offset="1" stop-color="#01050d"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#0759b9" stop-opacity=".30"/><stop offset=".42" stop-color="#04275a" stop-opacity=".13"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#061936"/><stop offset=".36" stop-color="#020b19"/><stop offset="1" stop-color="#01040a"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#073260" stop-opacity=".86"/><stop offset=".48" stop-color="#031326" stop-opacity=".94"/><stop offset="1" stop-color="#010712"/></linearGradient>
 <radialGradient id="moon" cx="32%" cy="27%"><stop stop-color="#fff"/><stop offset=".45" stop-color="#dbeaff"/><stop offset="1" stop-color="#6e8db7"/></radialGradient>
 <pattern id="stars" width="138" height="106" patternUnits="userSpaceOnUse"><circle cx="14" cy="22" r="1" fill="#9ceeff" opacity=".7"/><circle cx="78" cy="14" r=".8" fill="#2e8cff" opacity=".6"/><circle cx="119" cy="73" r="1.1" fill="#00c8ff" opacity=".7"/><circle cx="38" cy="91" r=".7" fill="#d7f8ff" opacity=".45"/></pattern>
 <pattern id="windows" width="14" height="18" patternUnits="userSpaceOnUse"><rect x="3" y="4" width="2.4" height="5" rx=".8" fill="#14cfff" opacity=".64"/><rect x="9" y="4" width="2.4" height="5" rx=".8" fill="#176dff" opacity=".48"/></pattern>
 <filter id="g1" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="g2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#sky)"/>
<rect width="1920" height="590" fill="url(#stars)" opacity=".8"/>
