name: Expand project archive

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "archive/READY"
      - "archive/part*.b64"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode and expand project
        shell: bash
        run: |
          set -euo pipefail
          cat archive/part*.b64 | base64 --decode > /tmp/Night-D1.zip
          mkdir -p /tmp/night-d1
          unzip -q /tmp/Night-D1.zip -d /tmp/night-d1
          rsync -a --delete --exclude='.git/' /tmp/night-d1/Night-D1/ ./

      - name: Validate expanded source
        shell: bash
        run: npm test

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish Night Shift NOC dashboard v2"
          git push
