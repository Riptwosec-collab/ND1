<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Night Shift NOC Operations Dashboard</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020811;color:#e9f8ff;font-family:Tahoma,Arial,sans-serif}body{display:grid;place-items:center}.loader{width:min(560px,calc(100% - 32px));padding:32px;border:1px solid #17647b;border-radius:18px;background:#06111f;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}.loader h1{font-size:clamp(22px,4vw,34px);margin:0 0 12px}.loader p{color:#8eb9c9}.bar{height:8px;border-radius:999px;background:#0c2534;overflow:hidden;margin-top:22px}.bar span{display:block;height:100%;width:35%;background:#39d8ff;border-radius:inherit;animation:move 1.1s ease-in-out infinite}@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(360%)}}#boot-error{color:#ff9b9b;white-space:pre-wrap;text-align:left;margin-top:16px}
  </style>
</head>
<body>
  <main class="loader" aria-live="polite">
    <h1>กำลังเปิด Night Shift NOC</h1>
    <p id="boot-status">กำลังโหลดไฟล์ระบบ…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p id="boot-error" hidden></p>
  </main>
  <script>
  (async function () {
    const status = document.getElementById('boot-status');
    const errorBox = document.getElementById('boot-error');
    const decoder = new TextDecoder();
    const encoder = new TextEncoder();

    function bytesToBase64(bytes) {
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function base64ToBytes(value) {
      const binary = atob(value.replace(/\s+/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function inflateRaw(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    async function unzip(bytes) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const files = new Map();
      let offset = 0;
      while (offset + 30 <= bytes.length && view.getUint32(offset, true) === 0x04034b50) {
        const flags = view.getUint16(offset + 6, true);
        const method = view.getUint16(offset + 8, true);
        const compressedSize = view.getUint32(offset + 18, true);
        const nameLength = view.getUint16(offset + 26, true);
        const extraLength = view.getUint16(offset + 28, true);
        if (flags & 0x08) throw new Error('ZIP data descriptor is not supported');
        const nameStart = offset + 30;
        const dataStart = nameStart + nameLength + extraLength;
        const name = decoder.decode(bytes.subarray(nameStart, nameStart + nameLength));
        const compressed = bytes.subarray(dataStart, dataStart + compressedSize);
        let content;
        if (method === 0) content = compressed;
        else if (method === 8) content = await inflateRaw(compressed);
        else throw new Error('Unsupported ZIP compression method: ' + method);
        if (!name.endsWith('/')) files.set(name.replace(/^Night-D1\//, ''), content);
        offset = dataStart + compressedSize;
      }
      return files;
    }

    function text(files, path) {
      const value = files.get(path);
      if (!value) throw new Error('ไม่พบไฟล์ ' + path);
      return decoder.decode(value);
    }

    try {
      const parts = [];
      for (let i = 1; i <= 10; i += 1) {
        status.textContent = 'กำลังโหลดไฟล์ระบบ ' + i + '/10…';
        const response = await fetch('./archive/part' + String(i).padStart(2, '0') + '.b64', {cache:'no-store'});
        if (!response.ok) throw new Error('โหลด archive part ' + i + ' ไม่สำเร็จ (' + response.status + ')');
        parts.push(await response.text());
      }
      status.textContent = 'กำลังเตรียม Dashboard…';
      const files = await unzip(base64ToBytes(parts.join('')));

      const cssPaths = ['variables.css','base.css','layout.css','components.css','pages.css','responsive.css'];
      const css = cssPaths.map(name => text(files, 'assets/css/' + name)).join('\n');
      const jsNames = ['router','storage','utils','modal','toast','dashboard','checklist','links','report','history','settings','app'];
      const imports = {};
      for (const name of jsNames) {
        let source = text(files, 'assets/js/' + name + '.js');
        source = source.replace(/from\s+(['"])\.\/([a-z-]+)\.js\1/g, "from 'night/$2'");
        source = source.replace(/import\s+(['"])\.\/([a-z-]+)\.js\1/g, "import 'night/$2'");
        imports['night/' + name] = 'data:text/javascript;base64,' + bytesToBase64(encoder.encode(source));
      }

      let page = text(files, 'index.html');
      page = page.replace(/\s*<link rel="stylesheet" href="\.\/assets\/css\/[^\"]+">/g, '');
      page = page.replace('</head>', '<style>' + css + '</style></head>');
      const importMap = JSON.stringify({imports: imports}).replace(/</g, '\\u003c');
      const scripts = '<script type="importmap">' + importMap + '</scr' + 'ipt>' +
        '<script type="module">import "night/app";</scr' + 'ipt>';
      page = page.replace('<script type="module" src="./assets/js/app.js"></scr' + 'ipt>', scripts);

      document.open();
      document.write(page);
      document.close();
    } catch (error) {
      console.error(error);
      status.textContent = 'เปิด Dashboard ไม่สำเร็จ';
      errorBox.hidden = false;
      errorBox.textContent = String(error && error.message ? error.message : error) + '\nกรุณากด Ctrl+F5 แล้วลองใหม่';
    }
  }());
  </script>
</body>
</html>
